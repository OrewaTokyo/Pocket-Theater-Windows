name: Unpack app.zip
# Push app.zip to the repo root (on any branch). It is unpacked into that same branch, and the Windows build
# is started on that branch.
on:
  push:
    paths: ["app.zip"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: unpack-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unpack:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack into folders
        run: |
          echo "Branch: $BRANCH"
          test -f app.zip || { echo "::error::app.zip was not found in the repo root of branch $BRANCH"; exit 1; }
          # app.zip may only carry app files. Workflows and anything pointing outside the repo are refused.
          if unzip -Z1 app.zip | grep -E '(^|/)\.\.(/|$)|^/|^\.github/'; then
            echo "::error::app.zip holds files this workflow does not unpack (listed above). Change those by hand in GitHub."; exit 1
          fi
          unzip -o app.zip
          rm app.zip
      - name: Commit to this branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack app.zip" || echo "Nothing to commit"
          git pull --rebase origin "$BRANCH" || true
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Start the Windows build on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-windows.yml --ref "$BRANCH" \
            && echo "Build started on $BRANCH" \
            || echo "::warning::Could not start build-windows.yml on $BRANCH. Make sure the file exists on that branch, then run Build Windows app by hand."